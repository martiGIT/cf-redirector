name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1" # weekly, Monday 06:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      # On private repos without GitHub Advanced Security the SARIF upload is
      # rejected ("code scanning not enabled"). Don't fail the job for that;
      # it works automatically once the repository is public.
      - uses: github/codeql-action/analyze@v4.37.3
        continue-on-error: true
